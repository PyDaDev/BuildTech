<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="PC gamer con ventiladores RGB">
  <defs>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      .blades { transform-box: fill-box; transform-origin: center; animation: spin 3.5s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .blades { animation: none; } }
    </style>

    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1850" />
      <stop offset="1" stop-color="#0a0820" />
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150f3d" />
      <stop offset="1" stop-color="#07051a" />
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd" />
      <stop offset="0.5" stop-color="#7c4dff" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="memoria" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#5b2fd6" />
    </linearGradient>
    <linearGradient id="reflejo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="difuso" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ventilador (radio 38, centrado en 0,0) -->
    <g id="ventilador">
      <circle r="38" fill="#0d0a2e" stroke="#7c4dff" stroke-width="3" />
      <circle r="34" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.8" />
      <g class="blades" fill="#7c4dff" opacity="0.9">
        <circle r="32" fill="none" />
        <path id="aspa" d="M0 -6 C 10 -12 14 -26 6 -33 C -4 -28 -8 -14 0 -6 Z" />
        <use href="#aspa" transform="rotate(51.4)" />
        <use href="#aspa" transform="rotate(102.8)" />
        <use href="#aspa" transform="rotate(154.2)" />
        <use href="#aspa" transform="rotate(205.6)" />
        <use href="#aspa" transform="rotate(257)" />
        <use href="#aspa" transform="rotate(308.4)" />
      </g>
      <circle r="8" fill="#1d1850" stroke="#c4b5fd" stroke-width="2" />
    </g>
  </defs>

  <!-- Resplandor y sombra -->
  <ellipse cx="200" cy="455" rx="140" ry="14" fill="#7c4dff" opacity="0.55" filter="url(#difuso)" />
  <rect x="48" y="40" width="304" height="400" rx="40" fill="#7c4dff" opacity="0.18" filter="url(#difuso)" />

  <!-- Patas -->
  <rect x="84" y="438" width="40" height="12" rx="4" fill="#0a0820" />
  <rect x="276" y="438" width="40" height="12" rx="4" fill="#0a0820" />

  <!-- Caja -->
  <rect x="60" y="20" width="280" height="420" rx="24" fill="url(#caja)" stroke="#2e2570" stroke-width="2" />
  <rect x="334" y="44" width="4" height="372" rx="2" fill="url(#neon)" filter="url(#brillo)" />
  <rect x="150" y="26" width="100" height="6" rx="3" fill="#0a0820" />
  <circle cx="318" cy="30" r="4" fill="#38bdf8" filter="url(#brillo)" />

  <!-- Panel de vidrio -->
  <rect x="72" y="42" width="256" height="384" rx="14" fill="url(#vidrio)" stroke="#3b2f8f" stroke-width="1.5" />

  <!-- Placa madre -->
  <rect x="84" y="56" width="132" height="250" rx="6" fill="#0f0b2e" stroke="#2a2060" stroke-width="1.5" />
  <path d="M96 290 H150 V270 H190 M96 250 H130 M170 230 H206 M96 200 H120 V170" fill="none" stroke="#3b2f8f" stroke-width="1.5" />

  <!-- Disipador del procesador -->
  <circle cx="132" cy="112" r="30" fill="#151034" stroke="#7c4dff" stroke-width="2.5" filter="url(#brillo)" />
  <circle cx="132" cy="112" r="20" fill="#0d0a2e" stroke="#c4b5fd" stroke-width="1.5" />
  <circle cx="132" cy="112" r="7" fill="#7c4dff" />

  <!-- Memoria RAM -->
  <g filter="url(#brillo)">
    <rect x="178" y="70" width="6" height="64" rx="2" fill="url(#memoria)" />
    <rect x="188" y="70" width="6" height="64" rx="2" fill="url(#memoria)" />
    <rect x="198" y="70" width="6" height="64" rx="2" fill="url(#memoria)" />
  </g>

  <!-- Ventiladores laterales -->
  <use href="#ventilador" transform="translate(272 98)" />
  <use href="#ventilador" transform="translate(272 184)" />
  <use href="#ventilador" transform="translate(272 270)" />

  <!-- Tarjeta gráfica -->
  <rect x="84" y="320" width="232" height="50" rx="9" fill="#1d1850" stroke="#7c4dff" stroke-width="2" />
  <rect x="92" y="364" width="216" height="3" rx="1.5" fill="url(#neon)" filter="url(#brillo)" />
  <use href="#ventilador" transform="translate(130 345) scale(0.5)" />
  <use href="#ventilador" transform="translate(200 345) scale(0.5)" />
  <use href="#ventilador" transform="translate(270 345) scale(0.5)" />

  <!-- Cámara de la fuente -->
  <rect x="80" y="382" width="240" height="36" rx="8" fill="#07051a" stroke="#2a2060" stroke-width="1.5" />
  <path d="M100 394 H300 M100 402 H300 M100 410 H300" stroke="#1d1850" stroke-width="2" stroke-linecap="round" />

  <!-- Reflejo del vidrio -->
  <path d="M72 56 Q72 42 86 42 H190 L72 230 Z" fill="url(#reflejo)" />
</svg>